@if(photos$ | async ; as photos)
{
@if(photos.length > 0)
{
<div class="grid grid-cols-4 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
    @for (item of photos; track item.id) {
    <img src="{{item.url}}" alt="Photo of member" class="w-full rounded-lg">
    }
     @for (item of photoMocks; track $index) {
    <img src="{{item.url}}" alt="Photo of member" class="w-full rounded-lg">
    }
</div>
}
}
