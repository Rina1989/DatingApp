{
@if(photos() ; as photos)
{
@if(photos.length > 0)
{
<div class="grid grid-cols-4 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
    @for (item of photos; track item.id) {
    <div class="relative">
        <img src="{{item.url}}" alt="Photo of member" class="w-full rounded-lg">
        @if(accountService.currentUser()?.id===memberService.member()?.id){
<app-star-button 
        [disabled]="item.url===memberService.member()?.imageUrl"
            [selected]="item.url===memberService.member()?.imageUrl" 
            (clickEvent)="setMainPhoto(item)" class="absolute top-1 right-1"/>

            <app-delete-button 
            [disabled]="item.url===memberService.member()?.imageUrl"
            (clickEvent)="deletePhoto(item.id)"
            class="absolute top-1 left-1"/>
            
        }
